<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amigo Oculto de Livros</title>
    <meta name="description" content="Crie um amigo oculto de livros, mande o link para a turma e faça o sorteio. Só cada pessoa vê quem tirou.">
    <meta name="theme-color" content="#f4ede0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f4ede0;
            --paper-2: #ebe2d0;
            --card: #fffaf1;
            --ink: #2a2119;
            --ink-2: #6b5d4f;
            --line: #d9ccb6;
            --accent: #8a2c35;
            --accent-ink: #fff7ef;
            --green: #2f5d50;
            --warn: #9a5b00;
            --shadow: 0 1px 0 rgba(60, 40, 20, .06), 0 8px 24px -12px rgba(60, 40, 20, .25);
            --radius: 14px;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #1b1714;
                --paper-2: #24201b;
                --card: #2a2520;
                --ink: #f1e8da;
                --ink-2: #b5a693;
                --line: #403830;
                --accent: #d0606b;
                --accent-ink: #1b1714;
                --green: #7fb7a4;
                --warn: #e0a34a;
                --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .7);
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: var(--paper);
            color: var(--ink);
            font: 17px/1.55 "Source Sans 3", system-ui, sans-serif;
            min-height: 100vh;
        }
        a { color: var(--accent); }
        h1, h2, h3, .serif { font-family: "Literata", Georgia, serif; font-weight: 600; line-height: 1.15; }
        h1 { font-size: clamp(2rem, 6vw, 2.9rem); margin: 0 0 .4rem; letter-spacing: -.01em; }
        h2 { font-size: 1.45rem; margin: 0 0 .75rem; }
        h3 { font-size: 1.1rem; margin: 0 0 .5rem; }
        p { margin: 0 0 .8rem; }
        .wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px 80px; }
        header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
        header.top a.brand { font-family: "Literata", Georgia, serif; font-weight: 700; text-decoration: none; color: var(--ink); font-size: 1.1rem; display: flex; gap: 8px; align-items: center; }
        .status { font-size: .8rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
        .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
        .status.ok i { background: var(--green); }
        .lead { color: var(--ink-2); font-size: 1.1rem; margin-bottom: 1.6rem; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); margin-bottom: 18px; }
        .muted { color: var(--ink-2); }
        .small { font-size: .88rem; }
        label { display: block; font-weight: 600; margin: 0 0 6px; font-size: .95rem; }
        label .opt { font-weight: 400; color: var(--ink-2); }
        .field { margin-bottom: 16px; }
        input[type=text], textarea {
            width: 100%; font: inherit; color: var(--ink); background: var(--paper);
            border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
        }
        textarea { min-height: 110px; resize: vertical; }
        input:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .row > .field { flex: 1 1 200px; }
        button, .btn {
            font: inherit; font-weight: 600; border-radius: 999px; padding: 11px 20px; cursor: pointer;
            border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
            display: inline-flex; align-items: center; gap: 8px; text-decoration: none; line-height: 1.2;
        }
        button.ghost, .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
        button.link { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; border-radius: 4px; }
        button:disabled { opacity: .55; cursor: default; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .copybox { display: flex; gap: 8px; align-items: stretch; margin-top: 6px; }
        .copybox input { font-size: .9rem; font-family: ui-monospace, Consolas, monospace; }
        .copybox button { flex: none; }
        ul.people { list-style: none; padding: 0; margin: 0; }
        ul.people li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
        ul.people li:first-child { border-top: none; }
        .pill { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); }
        .pill.go { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
        .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: .95rem; margin-bottom: .6rem; }
        .notice { border-left: 3px solid var(--warn); padding: 10px 14px; background: var(--paper-2); border-radius: 0 10px 10px 0; margin-bottom: 16px; font-size: .95rem; }
        .error { color: var(--accent); font-weight: 600; margin-top: 8px; min-height: 1.2em; }
        .wishes { white-space: pre-wrap; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0; }
        .list-groups a { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
        .list-groups a:first-of-type { border-top: none; }
        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: .95rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
        .toast.show { opacity: 1; }
        .steps { counter-reset: s; list-style: none; padding: 0; margin: 0 0 4px; }
        .steps li { counter-increment: s; position: relative; padding-left: 38px; margin-bottom: 10px; }
        .steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--paper-2); font-family: "Literata", serif; font-weight: 700; display: grid; place-items: center; font-size: .9rem; }

        /* o livro do sorteio: capa fechada que abre ao tocar */
        .book { perspective: 1400px; margin: 8px auto 18px; width: min(300px, 100%); aspect-ratio: 3 / 4; position: relative; }
        .book .page {
            position: absolute; inset: 0; border-radius: 6px 14px 14px 6px; background: var(--card);
            border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 22px; box-shadow: var(--shadow);
        }
        .book .page .who { font-family: "Literata", serif; font-size: clamp(1.7rem, 7vw, 2.3rem); font-weight: 700; line-height: 1.1; word-break: break-word; }
        .book .cover {
            position: absolute; inset: 0; border-radius: 6px 14px 14px 6px; transform-origin: left center;
            transition: transform .9s cubic-bezier(.2, .7, .2, 1); cursor: pointer; border: none; padding: 22px; color: #f6e9d6; font: inherit;
            background:
                linear-gradient(90deg, rgba(0,0,0,.28) 0 10px, rgba(255,255,255,.08) 10px 12px, transparent 12px),
                linear-gradient(160deg, #9b3540, #5e1b23);
            box-shadow: 0 18px 40px -18px rgba(60, 10, 20, .8);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
            backface-visibility: hidden; width: 100%;
        }
        .book .cover .t { font-family: "Literata", serif; font-size: 1.6rem; font-weight: 700; line-height: 1.15; }
        .book .cover .frame { border: 1px solid rgba(246, 233, 214, .5); border-radius: 4px; position: absolute; inset: 14px 14px 14px 24px; pointer-events: none; }
        .book.open .cover { transform: rotateY(-165deg); pointer-events: none; }
        @media (prefers-reduced-motion: reduce) { .book .cover { transition: none; } }

        footer { text-align: center; color: var(--ink-2); font-size: .85rem; margin-top: 40px; }
        .hidden { display: none !important; }
        .center { text-align: center; }
    </style>
    <script src="./config.js"></script>
</head>
<body>
    <div class="wrap">
        <header class="top">
            <a class="brand" href="#/"><span aria-hidden="true">📚</span> Amigo Oculto de Livros</a>
            <span id="status" class="status"><i></i><span>conectando…</span></span>
        </header>
        <main id="app" aria-live="polite"></main>
        <footer>Só quem participa vê quem tirou. Nem o organizador sabe.</footer>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
</body>
</html>
