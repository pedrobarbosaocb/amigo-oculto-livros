<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amigo Oculto de Livros</title>
    <meta name="description" content="Crie um amigo oculto de livros, mande o link para a turma e faça o sorteio. Só cada pessoa vê quem tirou.">
    <meta name="theme-color" content="#f7f3fb">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
    <style>
        :root {
            --bg: #f7f3fb;
            --card: #ffffff;
            --ink: #3b3650;
            --ink-2: #8a84a3;
            --line: #ebe5f3;
            --lilac: #d9cff7;
            --lilac-ink: #4a3d86;
            --mint: #cdeedd;
            --mint-ink: #2d6a50;
            --peach: #fddccd;
            --peach-ink: #94472a;
            --butter: #fbefc2;
            --butter-ink: #7a5d0b;
            --sky: #d3e7f8;
            --sky-ink: #2f5d84;
            --rose: #f8d3de;
            --rose-ink: #933a57;
            --shadow: 0 10px 30px -18px rgba(74, 61, 134, .35);
            --radius: 22px;
            color-scheme: light;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { background: var(--bg); color: var(--ink); font: 17px/1.5 "Nunito", system-ui, sans-serif; min-height: 100vh; }
        a { color: inherit; }
        h1, h2, .serif { font-family: "Literata", Georgia, serif; font-weight: 700; line-height: 1.15; margin: 0; }
        h1 { font-size: clamp(1.8rem, 6vw, 2.4rem); }
        h2 { font-size: 1.15rem; }
        p { margin: 0; }
        svg.lucide { width: 20px; height: 20px; stroke-width: 2; flex: none; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 64px; }

        header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
        .brand { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: var(--lilac); color: var(--lilac-ink); text-decoration: none; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--butter-ink); opacity: .6; }
        .dot.ok { background: var(--mint-ink); opacity: .8; }

        .stack { display: grid; gap: 14px; }
        .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
        .hero { text-align: center; padding: 8px 0 6px; display: grid; gap: 8px; justify-items: center; }
        .muted { color: var(--ink-2); }
        .small { font-size: .85rem; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: .88rem; background: var(--line); color: var(--ink); }
        .chip svg.lucide { width: 16px; height: 16px; }
        .c-lilac { background: var(--lilac); color: var(--lilac-ink); }
        .c-mint { background: var(--mint); color: var(--mint-ink); }
        .c-peach { background: var(--peach); color: var(--peach-ink); }
        .c-butter { background: var(--butter); color: var(--butter-ink); }
        .c-sky { background: var(--sky); color: var(--sky-ink); }
        .c-rose { background: var(--rose); color: var(--rose-ink); }

        /* campos com ícone, sem rótulo visível */
        .in { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 2px solid transparent; border-radius: 16px; padding: 0 14px; transition: border-color .15s; }
        .in:focus-within { border-color: var(--lilac); }
        .in > svg.lucide { color: var(--ink-2); }
        .in.top { align-items: flex-start; }
        .in.top > svg.lucide { margin-top: 14px; }
        .in input, .in textarea { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent; border: none; padding: 13px 0; outline: none; }
        .in textarea { min-height: 96px; resize: vertical; }
        .in input::placeholder, .in textarea::placeholder { color: var(--ink-2); opacity: .8; }
        .in input[readonly] { font-size: .85rem; color: var(--ink-2); }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

        button, .btn {
            font: inherit; font-weight: 800; cursor: pointer; border: none; border-radius: 16px; padding: 13px 18px;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; line-height: 1.1;
            background: var(--lilac); color: var(--lilac-ink); transition: transform .1s, filter .15s;
        }
        button:hover, .btn:hover { filter: brightness(.97); }
        button:active, .btn:active { transform: scale(.97); }
        button:disabled { opacity: .45; cursor: default; transform: none; }
        button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid var(--lilac-ink); outline-offset: 2px; }
        .wide { width: 100%; }
        .icon-btn { width: 44px; height: 44px; padding: 0; border-radius: 14px; flex: none; }
        .icon-btn.sm { width: 36px; height: 36px; border-radius: 12px; }
        .icon-btn.sm svg.lucide { width: 17px; height: 17px; }
        .btn.c-mint { background: var(--mint); color: var(--mint-ink); }
        .btn.c-sky { background: var(--sky); color: var(--sky-ink); }
        .plain { background: transparent; color: var(--ink-2); }
        .plain:hover { background: var(--bg); }
        .armed { background: var(--rose) !important; color: var(--rose-ink) !important; }
        .row { display: flex; gap: 8px; align-items: center; }
        .row.end { justify-content: flex-end; }
        .row.center { justify-content: center; }
        .spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

        ul.people { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
        ul.people li { display: inline-flex; align-items: center; gap: 4px; padding: 6px 6px 6px 8px; border-radius: 999px; background: var(--bg); font-weight: 700; }
        ul.people li .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 800; }
        ul.people li span.nm { padding: 0 6px 0 2px; }
        ul.people li button { width: 28px; height: 28px; padding: 0; border-radius: 50%; background: transparent; color: var(--ink-2); }
        ul.people li button svg.lucide { width: 15px; height: 15px; }
        ul.people li.me { background: var(--lilac); color: var(--lilac-ink); }

        .wishes { white-space: pre-wrap; background: var(--bg); border-radius: 16px; padding: 12px 14px; }
        .error:empty { display: none; }
        .error { color: var(--rose-ink); font-weight: 700; font-size: .9rem; min-height: 1.2em; text-align: center; }
        .list-groups { display: grid; gap: 8px; }
        .list-groups a { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--bg); text-decoration: none; font-weight: 700; }
        .list-groups a .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; }
        .list-groups a .sub { color: var(--ink-2); font-weight: 600; font-size: .85rem; }

        .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
        .steps div { display: grid; justify-items: center; gap: 6px; font-size: .78rem; font-weight: 700; color: var(--ink-2); }
        .steps .ic { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; }

        .big-num { font-family: "Literata", serif; font-size: 2.4rem; font-weight: 700; line-height: 1; }
        .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: .92rem; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); display: flex; gap: 8px; align-items: center; }
        .toast.show { opacity: 1; transform: translateX(-50%); }

        /* o livro do sorteio */
        .book { perspective: 1400px; margin: 4px auto; width: min(260px, 100%); aspect-ratio: 3 / 4; position: relative; }
        .book .page { position: absolute; inset: 0; border-radius: 8px 22px 22px 8px; background: var(--bg); display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 20px; }
        .book .page .who { font-family: "Literata", serif; font-size: clamp(1.7rem, 7vw, 2.2rem); font-weight: 700; line-height: 1.1; word-break: break-word; }
        .book .page svg.lucide { width: 28px; height: 28px; color: var(--rose-ink); }
        .book .cover {
            position: absolute; inset: 0; width: 100%; border-radius: 8px 22px 22px 8px; transform-origin: left center; padding: 0;
            transition: transform .9s cubic-bezier(.2, .7, .2, 1); backface-visibility: hidden;
            background: linear-gradient(90deg, rgba(0,0,0,.07) 0 12px, transparent 12px), linear-gradient(150deg, var(--rose), var(--lilac));
            color: var(--lilac-ink); display: grid; place-content: center; justify-items: center; gap: 10px;
        }
        .book .cover svg.lucide { width: 54px; height: 54px; stroke-width: 1.6; }
        .book .cover .tap { font-size: .85rem; font-weight: 800; opacity: .75; display: flex; gap: 6px; align-items: center; }
        .book .cover .tap svg.lucide { width: 16px; height: 16px; stroke-width: 2.2; }
        .book.open .cover { transform: rotateY(-165deg); pointer-events: none; }
        .waiting svg.lucide { width: 40px; height: 40px; color: var(--butter-ink); animation: spin 6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .book .cover { transition: none; } .waiting svg.lucide { animation: none; } }

        .hidden { display: none !important; }
        .center { text-align: center; }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
    <script src="./config.js"></script>
</head>
<body>
    <div class="wrap">
        <header class="top">
            <a class="brand" href="#/" title="Início" aria-label="Início"><i data-lucide="library-big"></i></a>
            <span id="status" class="dot" title="conectando…" role="status" aria-label="conectando…"></span>
        </header>
        <main id="app" aria-live="polite"></main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
</body>
</html>
